# Disposable approval probe. Never merge this branch.
name: Acceptance approval probe (STUB ONLY)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  build:
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'Harmless build stub; no build, tests, or QA commands.'

  lint:
    needs: build
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'Harmless lint stub; no build, tests, or QA commands.'

  generate:
    needs: build
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'Harmless generate stub; no build, tests, or QA commands.'

  snapshot-build:
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'Harmless snapshot-build stub; no build, tests, or QA commands.'

  test:
    name: Tests
    needs: build
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'Harmless test stub; no build, tests, or QA commands.'

  pr-title-format:
    name: Validate PR title
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'Harmless pr-title-format stub; no build, tests, or QA commands.'

  select-acceptance:
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.selection.outputs.suites }}
      validation-result: ${{ steps.selection.outputs.validation-result }}
      acceptance-result: ${{ steps.selection.outputs.acceptance-result }}
      failure-suite: ${{ steps.selection.outputs.failure-suite }}
      nonblocking-result: ${{ steps.selection.outputs.nonblocking-result }}
      delay-seconds: ${{ steps.selection.outputs.delay-seconds }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select suites and validate harmless probe inputs
        id: selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { pathToFileURL } = await import('node:url');
            const path = `${process.env.GITHUB_WORKSPACE}/.github/acceptance-tests/select-suites.mjs`;
            const { selectSuites } = await import(pathToFileURL(path));
            const requested = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (requested.head.ref !== 'cg/CLDAPI-1215/acceptance-approval-probe') {
              throw new Error('This disposable probe must never run from another branch.');
            }
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: requested.number,
            });
            const suites = selectSuites(current, requested.head.sha, repository);
            const scenario = JSON.parse(readFileSync('.github/acceptance-probe.json', 'utf8'));
            const allowed = {
              'validation-result': ['success', 'failure'],
              'acceptance-result': ['success', 'failure', 'skipped'],
              'failure-suite': suites,
              'nonblocking-result': ['success', 'failure'],
            };
            for (const [key, values] of Object.entries(allowed)) {
              if (!values.includes(scenario[key])) throw new Error(`Invalid probe input: ${key}`);
              core.setOutput(key, scenario[key]);
            }
            const delay = scenario['delay-seconds'];
            if (!Number.isInteger(delay) || delay < 0 || delay > 180) {
              throw new Error('Probe delay must be an integer from 0 to 180 seconds.');
            }
            core.setOutput('delay-seconds', delay);
            core.setOutput('suites', JSON.stringify(suites));
            core.info('STUB ONLY: no QA environment, inherited secrets, or cloud commands.');

  check-acceptance-revision:
    name: Check acceptance revision
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - &current-acceptance-pr
        name: Verify current PR revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const requested = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: requested.number,
            });
            if (current?.state !== 'open' || current?.head?.sha !== requested.head.sha) {
              throw new Error('Acceptance approval is for a closed or outdated PR revision.');
            }
            core.info(`Verified current PR #${requested.number} at ${requested.head.sha}.`);

  approve-acceptance:
    name: Approve acceptance
    needs: [check-acceptance-revision]
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    environment: acceptance-approval
    # Only supersede approval waits; never cancel resource commands or cleanup.
    concurrency:
      group: acceptance-approval-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: read
    steps:
      - *current-acceptance-pr

  acceptance-tests:
    permissions:
      pull-requests: read
    needs: [select-acceptance, approve-acceptance, validation]
    # Probe-only fault injection: make the aggregate observe a skipped prerequisite.
    if: needs.select-acceptance.outputs.acceptance-result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.select-acceptance.outputs.suites) }}
    uses: ./.github/workflows/acceptance-test.yaml
    with:
      suite: ${{ matrix.suite }}
      result: ${{ needs.select-acceptance.outputs.acceptance-result == 'failure' && matrix.suite == needs.select-acceptance.outputs.failure-suite && 'failure' || 'success' }}
      nonblocking-result: ${{ needs.select-acceptance.outputs.nonblocking-result }}
      delay-seconds: ${{ fromJson(needs.select-acceptance.outputs.delay-seconds) }}

  validation:
    name: PR validation
    needs: [build, lint, generate, snapshot-build, test, pr-title-format, select-acceptance]
    if: ${{ always() }}
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify job results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

      - name: Inject validation outcome (probe only)
        env:
          STUB_RESULT: ${{ needs.select-acceptance.outputs.validation-result }}
        run: test "$STUB_RESULT" = success

  pr-acceptance:
    name: PR acceptance
    needs: [select-acceptance, approve-acceptance, validation, acceptance-tests]
    if: ${{ always() }}
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require approved, successful acceptance
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
      - name: Summarize acceptance result
        run: echo 'All six harmless stubs passed after environment approval; this is NOT live acceptance evidence.' >> "$GITHUB_STEP_SUMMARY"
