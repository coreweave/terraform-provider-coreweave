# Terraform Provider testing workflow.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    uses: ./.github/workflows/build.yml
    with:
      native: true
      snapshot: false

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make lint

  generate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  snapshot-build:
    uses: ./.github/workflows/build.yml
    with:
      snapshot: true
      native: false

  # Check module consistency and unit tests before QA acceptance
  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: go mod download
      - name: Check go mod tidy
        run: go mod tidy -diff
      - run: go test -v -cover -skip '^TestKnownRegressions$' ./...
        timeout-minutes: 10

  pr-title-format:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Ensure PR title matches conventional commits format
        id: check_pr_title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          re_types="build|chore|ci|deps|docs|feat|fix|perf|refactor|revert|style|test"
          re_scope="\([[:alnum:]._\/-]+\)"
          re_emoji="(\p{Emoji}[[:space:]]{1,2})"
          re_message="([[:alnum:]])([[:space:][:print:]]|→)*"
          re_full="^($re_types)($re_scope)?!?: ($re_emoji)?($re_message)$"
          echo "Checking PR title '${PR_TITLE}' for conventional commits format..."
          set -x
          grep --version
          echo "Test regex: $re_full"

          tests_failed=0

          function run_test() {
            local input="${1}"

            echo "Input string: ${input}"

            if grep --color=always -P "$re_full" <<< "${input}"; then
              echo "Test Passed! ✅"
            else
              tests_failed=$((tests_failed + 1))
              echo "Test Failed! 🔻"
            fi
          }

          echo "testing a PR title that renovate would make"
          run_test 'fix(deps): update module google.golang.org/protobuf ( v1.36.10 → v1.36.11 )'

          echo "testing a PR title with an emoji..."
          run_test 'ci(test): 👷 debug grep version'

          echo "testing a PR title without an emoji.."
          run_test 'ci(test): debug grep version'

          echo "testing a PR title with a major version bump change"
          run_test 'ci(github-action)!: Update actions/cache action ( v4 → v5 )'

          if [ $tests_failed -gt 0 ]; then
            echo "One or more tests failed!"
            exit 1
          fi

          grep --color=always -P "$re_full" <<< "${PR_TITLE}" || {
            cat <<EOF
          PR title does not match conventional commits format. Please update the PR title to match the format: '<type>(<scope>): <description>'"
          See https://www.conventionalcommits.org/en/v1.0.0/ for more information.
          Test regex: '$re_full'
          EOF
            exit 1
          }

  select-acceptance:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.selection.outputs.suites }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'

      - name: Verify suite selection behavior
        run: node --test .github/acceptance-tests/*.test.mjs .github/release/*.test.mjs

      - name: Select release acceptance suites
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          selection_dir=$(mktemp -d)
          trap 'rm -rf "$selection_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$selection_dir/pr.json"
          node .github/acceptance-tests/select-suites.mjs "$selection_dir/pr.json" "$HEAD_SHA" "$GITHUB_REPOSITORY"

  acceptance-tests:
    permissions:
      contents: read
      pull-requests: read
      packages: read
      checks: write
    needs: [select-acceptance, build, lint, test]
    if: needs.select-acceptance.outputs.suites != '[]'
    strategy:
      # A failed suite must not cancel independent suites or their cleanup.
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.select-acceptance.outputs.suites) }}
    uses: ./.github/workflows/acceptance-test.yaml
    with:
      suite: ${{ matrix.suite }}
    secrets: inherit

  validation:
    name: PR validation
    needs: [build, lint, generate, snapshot-build, test, pr-title-format, select-acceptance, acceptance-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify job results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.select-acceptance.outputs.suites == '[]' && 'acceptance-tests' || '' }}
      - name: Summarize acceptance result
        env:
          SUITES: ${{ needs.select-acceptance.outputs.suites }}
        run: |
          if [ "$SUITES" = '[]' ]; then
            echo 'Hosted checks passed. Acceptance: skipped for an ordinary PR.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Hosted checks passed. All release acceptance suites passed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  release-acceptance:
    name: Release acceptance
    needs: [select-acceptance, validation, acceptance-tests]
    if: needs.select-acceptance.outputs.suites != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
