---
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - .github/renovate.json5
      - .github/renovate/**
      - .github/workflows/renovate.yml
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/renovate.json5
      - .github/renovate/**
      - .github/workflows/renovate.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Renovate configuration
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # The validator discovers global config in its working directory. An empty
      # directory prevents a candidate config.js from being loaded as executable code.
      - name: Validate repository configuration
        working-directory: ${{ runner.temp }}
        env:
          LOG_LEVEL: info
        run: |
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          cd "$validation_dir"
          npx --yes --package renovate@44.51.2 -- renovate-config-validator --strict --no-global "$GITHUB_WORKSPACE/.github/renovate.json5"

      - name: Verify validator behavior
        working-directory: ${{ runner.temp }}
        env:
          LOG_LEVEL: info
        run: |
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          cd "$validation_dir"
          npx --yes --package renovate@44.51.2 -- node "$GITHUB_WORKSPACE/.github/renovate/tests/validate.mjs"

  renovate:
    name: Renovate
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - uses: ./.github/actions/setup

      # Artifact commands use the cloned repository's Mise configuration. Trust
      # only this repository's clone path in the ephemeral runner's global config.
      - name: Trust Renovate Go workspace
        run: |
          mise settings set trusted_config_paths "/tmp/renovate/repos/github/$GITHUB_REPOSITORY/.config/mise.toml"

      - name: Configure Git identity
        run: |
          git config --global user.email 'bot@renovateapp.com'
          git config --global user.name 'Renovate Bot'

      - name: Generate repository token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.ORG_RENOVATE_CLIENTID }}
          private-key: ${{ secrets.ORG_RENOVATE_PRIVATEKEY }}
          owner: ${{ github.repository_owner }}
          repositories: terraform-provider-coreweave

      - name: Update dependencies
        run: npx --yes --package renovate@44.51.2 -- renovate "$GITHUB_REPOSITORY"
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_BASE_DIR: /tmp/renovate
          RENOVATE_PLATFORM_COMMIT: 'true'
          RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
          RENOVATE_ALLOWED_ENV: '["CGO_ENABLED", "GOPROXY"]'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"CGO_ENABLED":"0","GOPROXY":"https://proxy.golang.org,direct"}'
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"ghcr.io","username":"gitops","password":"${{ github.token }}"}]
