---
name: Renovate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/renovate.json5
      - .github/renovate/**
      - .github/workflows/renovate.yml
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/renovate.json5
      - .github/renovate/**
      - .github/workflows/renovate.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Renovate configuration
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.21.0'

      # The validator discovers global config in its working directory. An empty
      # directory prevents a candidate config.js from being loaded as executable code.
      - name: Validate repository configuration
        working-directory: ${{ runner.temp }}
        env:
          LOG_LEVEL: info
        run: |
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          cd "$validation_dir"
          npx --yes --package renovate@44.51.2 -- renovate-config-validator --strict --no-global "$GITHUB_WORKSPACE/.github/renovate.json5"

      - name: Verify validator behavior
        working-directory: ${{ runner.temp }}
        env:
          LOG_LEVEL: info
        run: |
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          cd "$validation_dir"
          npx --yes --package renovate@44.51.2 -- node "$GITHUB_WORKSPACE/.github/renovate/tests/validate.mjs"
