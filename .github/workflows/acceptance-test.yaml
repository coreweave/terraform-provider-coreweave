# Disposable stubs only. Never merge this branch.
name: Run Acceptance Stub

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      result:
        required: true
        type: string
      nonblocking-result:
        required: true
        type: string
      delay-seconds:
        required: true
        type: number

# Exercise serialization without occupying the real acceptance locks.
concurrency:
  group: acceptance-probe-test-${{ inputs.suite }}
  queue: max
  cancel-in-progress: false

permissions:
  pull-requests: read

jobs:
  sweep:
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    steps:
      - &current-pr
        name: Verify current PR revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const requested = context.payload.pull_request;
            if (context.eventName !== 'pull_request' || !Number.isInteger(requested?.number) ||
                requested.number <= 0 || !/^[a-f0-9]{40}$/.test(requested?.head?.sha)) {
              throw new Error('Acceptance requires a pull request with a valid head SHA.');
            }
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: requested.number,
            });
            if (current?.state !== 'open' || current?.head?.sha !== requested.head.sha) {
              throw new Error('Acceptance stopped: the requested PR revision is closed or outdated.');
            }
            core.info(`Verified current PR head ${requested.head.sha}.`);
      - run: echo 'Sweep stub; no resources are inspected or changed.'

  test:
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    needs: [sweep]
    steps:
      - *current-pr
      - name: Harmless acceptance stub
        env:
          STUB_DELAY: ${{ inputs.delay-seconds }}
          STUB_RESULT: ${{ inputs.result }}
        run: |
          echo 'Starting harmless acceptance stub.'
          sleep "$STUB_DELAY"
          test "$STUB_RESULT" = success
      - name: Record cleanup opportunity
        if: ${{ always() }}
        run: echo 'Cleanup stub reached; no resources exist to clean up.'

  nonblocking:
    name: Non-blocking acceptance (${{ inputs.suite }})
    continue-on-error: true
    runs-on: cw-static-pub-x64-4c
    timeout-minutes: 5
    needs: [sweep]
    steps:
      - *current-pr
      - name: Harmless informational stub
        env:
          STUB_RESULT: ${{ inputs.nonblocking-result }}
        run: test "$STUB_RESULT" = success
