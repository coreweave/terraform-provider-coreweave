---
name: Run Acceptance Test

'on':
  workflow_call:
    inputs:
      suite:
        description: 'Test suite to run (e.g., cks, networking, object-storage)'
        required: true
        type: string

concurrency:
  group: acceptance-test-${{ inputs.suite }}
  queue: max
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: cw
    permissions: &acceptance-permissions
      contents: read
      pull-requests: read
      packages: read
    container: ghcr.io/coreweave/github-actions-images/github-base-runner:1.21.0
    environment: QA
    env:
      COREWEAVE_API_ENDPOINT: ${{ inputs.suite == 'object_storage' && secrets.COREWEAVE_OBJS_API_ENDPOINT || vars.COREWEAVE_API_ENDPOINT }}
      COREWEAVE_API_TOKEN: ${{ inputs.suite == 'object_storage' && secrets.COREWEAVE_OBJS_API_TOKEN || secrets.COREWEAVE_API_TOKEN }}
      TEST_ACC_SWEEP_TIMEOUT: ${{ inputs.suite == 'inference' && '105m' || '45m' }}
      TEST_ACC_SWEEP_ZONE: ${{ inputs.suite == 'object_storage' && 'US-EAST-04A' || inputs.suite == 'inference' && 'RNO2A' || 'US-LAB-01A' }}
      COREWEAVE_CONTAINER_REGISTRY_TEST_ZONE: ${{ inputs.suite == 'container_registry' && 'US-LAB-01A' || '' }}
      COREWEAVE_CONTAINER_REGISTRY_TEST_PREFIX: ${{ inputs.suite == 'container_registry' && (vars.COREWEAVE_CONTAINER_REGISTRY_TEST_PREFIX || 'q-tfacc-cr-') || '' }}
    steps:
      - &current-pr
        name: Verify current PR revision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const requested = context.payload.pull_request;
            if (context.eventName !== 'pull_request' || !Number.isInteger(requested?.number) ||
                requested.number <= 0 || !/^[a-f0-9]{40}$/.test(requested?.head?.sha)) {
              throw new Error('Acceptance requires a pull request with a valid head SHA.');
            }
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: requested.number,
            });
            if (current?.state !== 'open' || current?.head?.sha !== requested.head.sha) {
              throw new Error('Acceptance stopped: the requested PR revision is closed or outdated.');
            }
            core.info(`Verified current PR head ${requested.head.sha}.`);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - *current-pr

      - name: Sweep ${{ inputs.suite }} resources
        run: make testacc-sweep SUITES='${{ inputs.suite }}'

  test:
    runs-on: cw
    permissions: *acceptance-permissions
    container: ghcr.io/coreweave/github-actions-images/github-base-runner:1.21.0
    environment: QA
    needs: [sweep]
    env:
      COREWEAVE_API_ENDPOINT: ${{ inputs.suite == 'object_storage' && secrets.COREWEAVE_OBJS_API_ENDPOINT || vars.COREWEAVE_API_ENDPOINT }}
      COREWEAVE_API_TOKEN: ${{ inputs.suite == 'object_storage' && secrets.COREWEAVE_OBJS_API_TOKEN || secrets.COREWEAVE_API_TOKEN }}
      TEST_ACC_SWEEP_ZONE: ${{ inputs.suite == 'object_storage' && 'US-EAST-04A' || inputs.suite == 'inference' && 'RNO2A' || 'US-LAB-01A' }}
      COREWEAVE_CONTAINER_REGISTRY_TEST_ZONE: ${{ inputs.suite == 'container_registry' && 'US-LAB-01A' || '' }}
      COREWEAVE_CONTAINER_REGISTRY_TEST_PREFIX: ${{ inputs.suite == 'container_registry' && (vars.COREWEAVE_CONTAINER_REGISTRY_TEST_PREFIX || 'q-tfacc-cr-') || '' }}
      INFR_ZONE: 'RNO2A'
      INFR_INSTANCE_ID: 'gd-1xgh200'
      TF_IN_AUTOMATION: '1'
    steps:
      - *current-pr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: go mod download
      - *current-pr

      - name: Validate ${{ inputs.suite }} acceptance tests
        run: |
          make testacc SUITES='${{ inputs.suite }}' ${{ inputs.suite == 'cks' && 'TEST_ACC_PARALLEL=3 TEST_ACC_TIMEOUT=60m' || '' }}
