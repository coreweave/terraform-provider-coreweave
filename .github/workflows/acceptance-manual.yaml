---
# Manual observability acceptance runs against a dedicated organization.
#
# Ordinary PRs never select QA suites (see .github/acceptance-tests/README.md);
# acceptance runs only on the release-please PR, which is after merge. This
# workflow is how a suite gets exercised against code that is still in review.
#
# It deliberately does not reuse acceptance-test.yaml. That workflow's freshness
# guard requires a pull_request event and rejects every other event, a property
# its tests pin; dispatching through it would mean weakening that.
#
# The observability token is its own secret in the QA environment, the way
# object_storage already carries COREWEAVE_OBJS_API_TOKEN. It must belong to an
# organization whose registered clusters are lab-only: a pipeline creates one
# connector per source Kafka cluster holding the stream's topics, so running the
# pipeline suites as an organization with production clusters registered would
# provision real connectors in a production zone. Other suites continue to use
# their release-acceptance credentials.
#
# Note this shares the QA environment with release acceptance, so a dispatched
# branch can read that environment's other secrets. Dispatch already requires
# write access, which is the control being relied on.
name: Acceptance (manual)

'on':
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        type: choice
        options:
          - observability
          - caller_identity
          - cks
          - networking
          - object_storage
          - inference
          - container_registry
      run:
        description: 'go test -run filter (optional; omit to run the whole suite)'
        required: false
        type: string

# Shares the release matrix lock so a manual run and a release run cannot
# operate on the same suite's resources at once.
concurrency:
  group: acceptance-test-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: cw
    container: ghcr.io/coreweave/github-actions-images/github-base-runner:1.21.0
    environment: QA
    permissions:
      contents: read
      packages: read
    env:
      COREWEAVE_API_ENDPOINT: ${{ inputs.suite == 'object_storage' && secrets.COREWEAVE_OBJS_API_ENDPOINT || vars.COREWEAVE_API_ENDPOINT }}
      COREWEAVE_API_TOKEN: ${{ secrets[inputs.suite == 'object_storage' && 'COREWEAVE_OBJS_API_TOKEN' || inputs.suite == 'observability' && 'COREWEAVE_OBSERVABILITY_API_TOKEN' || 'COREWEAVE_API_TOKEN'] }}
      TEST_ACC_SWEEP_ZONE: ${{ inputs.suite == 'object_storage' && 'US-EAST-04A' || inputs.suite == 'inference' && 'RNO2A' || 'US-LAB-01A' }}
      TEST_ACC_SWEEP_TIMEOUT: ${{ inputs.suite == 'inference' && '105m' || '45m' }}
      COREWEAVE_CONTAINER_REGISTRY_TEST_ZONE: ${{ inputs.suite == 'container_registry' && 'US-LAB-01A' || '' }}
      COREWEAVE_CONTAINER_REGISTRY_TEST_PREFIX: ${{ inputs.suite == 'container_registry' && (vars.COREWEAVE_CONTAINER_REGISTRY_TEST_PREFIX || 'q-tfacc-cr-') || '' }}
      INFR_ZONE: 'RNO2A'
      INFR_INSTANCE_ID: 'gd-1xgh200'
      TEST_ACC_RUN: ${{ inputs.run }}
      TF_IN_AUTOMATION: '1'
    steps:
      - name: Record what is running
        run: |
          {
            echo "Suite: ${{ inputs.suite }}"
            echo "Ref: ${{ github.ref }} (${{ github.sha }})"
            echo "Filter: ${TEST_ACC_RUN:-(whole suite)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
      - run: go mod download

      # Always sweep first: an interrupted run leaves resources behind that
      # collide with the slugs the suites generate.
      - name: Sweep ${{ inputs.suite }} resources
        run: make testacc-sweep SUITES='${{ inputs.suite }}'

      - name: Validate ${{ inputs.suite }} acceptance tests
        run: |
          make testacc SUITES='${{ inputs.suite }}' \
            ${{ inputs.suite == 'cks' && 'TEST_ACC_PARALLEL=3 TEST_ACC_TIMEOUT=60m' || '' }}
